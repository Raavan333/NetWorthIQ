name: Build Android APK (CI/CD)

on:
  push:
    branches: [ main, master, dev, develop ]
  pull_request:
    branches: [ main, master, dev, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Set up Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Configure Preinstalled Android SDK
        run: |
          echo "Using Android SDK at: $ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Node Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Run Typecheck & Lint
        run: npm run lint

      - name: Run Financial & Ledger Test Suite
        run: npm test

      - name: Build Web Application Bundle
        run: npm run build

      - name: Sync Capacitor Android Native Project
        run: npx cap sync android

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compile Android APK via Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Package Installable Android APK
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/app/build/outputs/apk/debug -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find android/app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" output-apk/NetWorthIQ-v4.0.apk
            echo "Successfully packaged Android APK:"
            ls -lh output-apk/NetWorthIQ-v4.0.apk
          else
            echo "::error::No APK file found in android/app/build/outputs/apk!"
            exit 1
          fi

      - name: Upload Installable Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetWorthIQ-Android-APK
          path: output-apk/NetWorthIQ-v4.0.apk
          retention-days: 30

      - name: Attach APK to GitHub Release (on tagged release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/NetWorthIQ-v4.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
